# Namma Metro Ridership Forecasting System - configuration (SRS v2.0)
project: Namma Metro Ridership Forecasting System
version: "1.0.0"
timezone: Asia/Kolkata          # all timestamps are local Bengaluru time
hour_bucket_convention: "start-of-hour: hour h = [h:00, h+1:00); hour 23 = 23:00 to last train"
seed: 42
horizon_days: 7                 # 7 x 24 = 168 hourly steps
non_operating_hours: [1, 2, 3]  # >99.9% zero in source; forecast fixed at 0 and flagged
paths:
  raw_dir: data/raw
  sources: data/raw/sources.json
  outputs: outputs
  db: outputs/namma_metro.db
  od_cache: outputs/od_summary.json
validation:
  suspect_mad_z: 10             # robust z-score (per station/hour/day-type) above which a value is flagged SUSPECT
  suspect_min_abs: 300          # ...and absolute deviation must exceed this many passengers
  opening_threshold_frac: 0.10 # first day with >=10% of the station's median daily traffic = commercial opening
  min_obs_days_for_forecast: 14 # stations with fewer observed days get a LIMITED_HISTORY flag
evaluation:
  n_folds: 3                    # rolling-origin folds, each with a 7-day test window
  mape_min_actual: 20           # hourly MAPE ignores actuals below this (reported as excluded)
  daily_mape_min_actual: 200
  interval_coverage: 0.8        # empirical (split-conformal style) prediction interval
  profile_window_days: 35       # window for hour-of-day share profiles
realtime:
  as_of: null                   # run date; null = today's date from the system clock (override with --as-of YYYY-MM-DD)
  start_offset_days: 1          # first forecast day = run date + 1; the window is horizon_days long
  stale_hourly_days: 14         # station-hour data older than this (vs first forecast day) -> tracker-driven top-down is used in production
  band_inflation_stale: 1.5     # widen station/hour intervals when the station shares are that old (heuristic, documented)
network_tracker:
  max_horizon_days: 21          # longest tracker-forecast horizon with empirical bands
  first_origin: "2026-01-04"    # weekly rolling origins from here
  step_days: 7
  recent_folds: 8
xgboost:
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 5
  subsample: 0.8
  colsample_bytree: 0.8
  n_jobs: 1                     # single thread => reproducible (NFR-04)
