<style>

}

  --s1:#8f5fc9; --s2:#c97512; --s3:#2a9a6d; --s4:#4682c0; --s5:#c9547f; --s6:#a3961a; --s7:#cf5656; --s8:#3aa0ae;
  --good:#5cbf7c; --warn:#e0a63a; --crit:#ee7a70; --good-bg:#182a1e; --warn-bg:#33280f; --crit-bg:#361b18; --hatch:#3d3946; --shadow:0 6px 18px rgba(0,0,0,.45); color-scheme:dark}}

}
