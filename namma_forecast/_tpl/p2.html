<script>
"use strict";
let D=null;
let ANIM=false;   // true only while a page render is running, so charts animate on navigation/control changes but not on resize or hover
const motionOK=()=>!matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n0=v=>v==null||isNaN(v)?'–':Math.round(v).toLocaleString('en-IN');

const pct=v=>v==null||isNaN(v)?'–':n1(v)+'%';
const sgn=v=>v==null?'–':Math.abs(v)<0.05?'0.0%':(v>0?'+':'')+n1(v)+'%';
const short=v=>{v=Math.abs(v)>=1e6?(v/1e6).toFixed(v%1e6?2:0)+'M':Math.abs(v)>=1e3?(v/1e3).toFixed(v%1e3?(Math.abs(v)<1e4?1:0):0)+'k':String(Math.round(v));return v};
const DOWN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const fdate=(s,o)=>{const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-GB',o||{day:'2-digit',month:'short'})};
const fdowdate=s=>DOWN[(new Date(s+'T00:00:00').getDay()+6)%7]+' '+fdate(s);
const hh=h=>String(h).padStart(2,'0')+':00';
const sum=a=>a.reduce((x,y)=>x+y,0);
const MEAS={entries:{label:'Entries',unit:'passengers entering',col:'var(--s1)'},exits:{label:'Exits',unit:'passengers exiting',col:'var(--s2)'}};
const st={page:'overview',measure:'entries',station:null,compare:'',gran:'hourly',scope:'station',models:'hourly',sortKey:'avg',sortDir:-1,line:'all',q:''};
/* ------------------------------------------------------------ data helpers */
let S=0,ND=0,ST=[],NAME={};
function prep(){
  S=D.stations.length;ND=D.dates.length;ST=D.stations;
  ST.forEach((s,i)=>{s.i=i;NAME[s.id]=s.name});
  st.station=ST.reduce((b,s)=>s.name==='Nadaprabhu Kempegowda Station, Majestic'?s:b,ST[0]).i;
  D.fdates.forEach(x=>x.fc=true);
  D.dates.forEach((x,d)=>{x.imp=D.hist.status.some(s=>s.charCodeAt(d)===51)});   // day contains model-filled (imputed) station values
}
const stat=(s,d)=>D.hist.status[s].charCodeAt(d)-48;           // 1 observed, 2 not open, 0 missing date
const hv=(m,s,d,h)=>{const v=D.hist[m][s][d*24+h];return v==null||v<0?null:v};   // hourly values exist for observed days only
function dayTot(m,s){const out=[];for(let d=0;d<ND;d++){if(stat(s,d)!==1){out.push(null);continue}let t=0;for(let h=0;h<24;h++)t+=D.hist[m][s][d*24+h];out.push(t)}return out}
const _dt={};const DT=(m,s)=>_dt[m+s]??(_dt[m+s]=dayTot(m,s));
function netTot(m){const key='net'+m;if(_dt[key])return _dt[key];const o=[],n=[];for(let d=0;d<ND;d++){let t=0,c=0;for(let s=0;s<S;s++){if(stat(s,d)===1){c++;const v=DT(m,s)[d];t+=v}}o.push(c?t:null);n.push(c)}_dt[key]=o;_dt['n'+m]=n;return o}
const DTI=(m,s)=>_dt['i'+m+s]??(_dt['i'+m+s]=DT(m,s).map((v,d)=>v!=null?v:D.hist.impd[m][s][d]));      // observed, else imputed
const IMP=(m,s)=>DT(m,s).map((v,d)=>v==null?D.hist.impd[m][s][d]:null);                                          // imputed days only
function netTotI(m){const key='neti'+m;if(_dt[key])return _dt[key];const o=[];for(let d=0;d<ND;d++){let t=0,c=0;for(let q=0;q<S;q++){const v=DTI(m,q)[d];if(v!=null){t+=v;c++}}o.push(c?t:null)}return _dt[key]=o}
const netImp=m=>{const t=netTot(m),a=netTotI(m);return a.map((v,d)=>t[d]==null?v:null)};
const nOpen=()=>{netTot('entries');return _dt['nentries']};
const fullDays=()=>{const n=nOpen(),mx=Math.max(...n);return D.dates.map((x,i)=>n[i]===mx)};
function fcHourly(m,s){return D.fc[m].pred[s]}
const fcDaily=(m,s)=>{const a=D.fc[m].pred[s],o=[];for(let k=0;k<7;k++)o.push(sum(a.slice(k*24,k*24+24)));return o};
const fcNet=m=>{const o=Array(7).fill(0);for(let s=0;s<S;s++){const d=fcDaily(m,s);for(let k=0;k<7;k++)o[k]+=d[k]}return o};
const fcNetH=m=>{const o=Array(168).fill(0);for(let s=0;s<S;s++){const a=D.fc[m].pred[s];for(let i=0;i<168;i++)o[i]+=a[i]}return o};
const fcNetHBase=m=>{const o=Array(168).fill(0);for(let s=0;s<S;s++){const a=D.fc[m].base[s];for(let i=0;i<168;i++)o[i]+=a[i]}return o};
function profile(m,s,sel){ // avg by hour over observed full days matching sel(dow)
  const fd=fullDays(),acc=Array(24).fill(0);let n=0;
  for(let d=0;d<ND;d++){if(!fd[d]&&s!=null&&stat(s,d)!==1)continue;if(s==null&&!fd[d])continue;if(s!=null&&stat(s,d)!==1)continue;if(!sel(D.dates[d].dow))continue;n++;
    if(s==null){for(let q=0;q<S;q++)for(let h=0;h<24;h++)acc[h]+=hv(m,q,d,h)||0}else for(let h=0;h<24;h++)acc[h]+=hv(m,s,d,h)||0}
  return {v:acc.map(x=>n?x/n:null),n}
}
function stationStats(m){
  const fd=fullDays();
  return ST.map(s=>{const t=DT(m,s.i);let wk=[],we=[],all=[];for(let d=0;d<ND;d++){if(t[d]==null)continue;all.push(t[d]);(D.dates[d].dow<5?wk:we).push(t[d])}
    const avg=a=>a.length?sum(a)/a.length:null;const f=fcDaily(m,s.i);const ti=DTI(m,s.i);const last7=ti.slice(-7).filter(v=>v!=null);
    const pw=profile(m,s.i,dw=>dw<5).v;let pk=null;if(pw[0]!=null)pk=pw.indexOf(Math.max(...pw));
    return {i:s.i,name:s.name,line:s.line,avgWk:avg(wk),avgWe:avg(we),avg:avg(all),tot:sum(all),days:all.length,peak:pk,fc7:sum(f),last7:sum(last7),chg:last7.length==7?(sum(f)/sum(last7)-1)*100:null,flag:s.flag}})
}
/* ------------------------------------------------------------ theme + charts */
const isDark=()=>{const t=document.documentElement.dataset.theme;return t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)};
const RAMP=['#efe6f6','#d8c3ea','#bd9ad9','#9c6cc3','#7a45a6','#582b80','#3a1a58'];
function ramp(t){const r=isDark()?RAMP.slice().reverse():RAMP;t=Math.max(0,Math.min(1,t));const x=t*(r.length-1),i=Math.floor(x),f=x-i;if(i>=r.length-1)return r[r.length-1];
  const a=r[i],b=r[i+1],p=c=>[1,3,5].map(k=>parseInt(c.slice(k,k+2),16));const A=p(a),B=p(b);return 'rgb('+A.map((v,k)=>Math.round(v+(B[k]-v)*f)).join(',')+')'}
function nice(max,n=5){if(!(max>0))return{max:1,step:.2};const raw=max/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),r=raw/mag,st=(r<=1?1:r<=2?2:r<=2.5?2.5:r<=5?5:10)*mag;return{max:Math.ceil(max/st)*st,step:st}}
const tipEl=host=>{let t=host.querySelector('.tip');if(!t){t=document.createElement('div');t.className='tip';t.hidden=true;host.appendChild(t)}return t};
function placeTip(host,t,x,y){const w=host.clientWidth;t.hidden=false;const tw=t.offsetWidth;let l=x+14;if(l+tw>w)l=x-tw-14;t.style.left=Math.max(0,l)+'px';t.style.top=Math.max(0,y-10)+'px'}
function legend(items){return '<div class="legend">'+items.map(i=>i.box?`<span><i class="box" style="background:${i.color}"></i>${esc(i.name)}</span>`:`<span><i class="${i.dash?'dash':''}" style="border-color:${i.color}"></i>${esc(i.name)}</span>`).join('')+'</div>'}
/* line chart with optional band; null breaks the line */
function lineChart(host,o){
  const W=host.clientWidth||640,H=o.height||(W<520?220:280),m={l:o.yw||58,r:14,t:10,b:o.xb||30},iw=W-m.l-m.r,ih=H-m.t-m.b,N=o.labels.length;
  let mx=0;o.series.forEach(s=>{s.vals.forEach(v=>{if(v!=null&&v>mx)mx=v});if(s.band)s.band[1].forEach(v=>{if(v!=null&&v>mx)mx=v})});
  const yt=nice(mx*1.03),X=i=>m.l+(N<2?iw/2:i*iw/(N-1)),Y=v=>m.t+ih-v/yt.max*ih;
  let g='';for(let v=0;v<=yt.max+1e-9;v+=yt.step){g+=`<line class="gridl" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${esc((o.yFmt||short)(v))}</text>`}
  const every=o.xevery||Math.max(1,Math.ceil(N/Math.max(2,Math.floor(iw/(o.xgap||64)))));
  o.labels.forEach((l,i)=>{if(i%every===0||(o.xticks&&o.xticks.includes(i)))g+=`<text class="axis" x="${X(i)}" y="${H-m.b+16}" text-anchor="middle">${esc(o.xFmt?o.xFmt(l,i):l)}</text>`});
  (o.vlines||[]).forEach(v=>{g+=`<line x1="${X(v.i)}" x2="${X(v.i)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--muted)" stroke-dasharray="3 3"/><text class="axis" x="${X(v.i)+4}" y="${m.t+10}" text-anchor="${v.i>N*.7?'end':'start'}" ${v.i>N*.7?`dx="-8"`:''}>${esc(v.label)}</text>`});
  if(o.shade)o.shade.forEach(r=>{g+=`<rect x="${X(r[0])}" y="${m.t}" width="${Math.max(1,X(r[1])-X(r[0]))}" height="${ih}" fill="var(--accent)" opacity=".06"/>`});
  g+='<g id="plot">';
  o.series.forEach(s=>{
    if(s.band){let up=[],dn=[],segs=[];for(let i=0;i<N;i++){if(s.band[0][i]==null){if(up.length)segs.push([up,dn]);up=[];dn=[];continue}up.push([X(i),Y(s.band[1][i])]);dn.push([X(i),Y(s.band[0][i])])}if(up.length)segs.push([up,dn]);
      segs.forEach(([u,d])=>{g+=`<path d="M${u.map(p=>p.join(',')).join('L')}L${d.slice().reverse().map(p=>p.join(',')).join('L')}Z" fill="${s.color}" opacity=".16"/>`})}
    let d='',pen=false;s.vals.forEach((v,i)=>{if(v==null){if(!s.bridge)pen=false;return}d+=(pen?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1);pen=true});
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;
    if(s.dots)s.vals.forEach((v,i)=>{if(v!=null)g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5"/>`});
  });g+='</g>';
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(o.aria||'chart')}">${g}<line id="xh" y1="${m.t}" y2="${m.t+ih}" stroke="var(--muted)" opacity="0" /><g id="dots"></g><rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/></svg>`;
  const svg=host.firstChild,xh=svg.querySelector('#xh'),dots=svg.querySelector('#dots'),t=tipEl(host);
  if(ANIM&&motionOK()){const pl=svg.querySelector('#plot');if(pl&&pl.animate)pl.animate([{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],{duration:1100,easing:'cubic-bezier(.3,.6,.2,1)'})}
  const mv=e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width;let i=Math.round((px-m.l)/iw*(N-1));i=Math.max(0,Math.min(N-1,i));
    xh.setAttribute('x1',X(i));xh.setAttribute('x2',X(i));xh.setAttribute('opacity','.6');
    dots.innerHTML=o.series.map(s=>s.vals[i]==null?'':`<circle cx="${X(i)}" cy="${Y(s.vals[i])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
    const rows=o.series.filter(s=>s.vals[i]!=null).map(s=>`<div class="r"><span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span><b>${(o.tipFmt||n0)(s.vals[i])}</b></div>`+(s.band&&s.band[0][i]!=null?`<div class="r" style="color:var(--muted)"><span>&nbsp;&nbsp;80% band</span><span>${n0(s.band[0][i])} – ${n0(s.band[1][i])}</span></div>`:'')).join('');
    t.innerHTML=`<b>${esc(o.tipTitle?o.tipTitle(i):o.labels[i])}</b>${o.tipExtra?o.tipExtra(i):''}${rows||'<div style="color:var(--muted)">no data</div>'}`;placeTip(host,t,(X(i)/W)*host.clientWidth,m.t+ih/3)};
  const lv=()=>{t.hidden=true;xh.setAttribute('opacity','0');dots.innerHTML=''};
  const hit=svg.querySelector('#hit');hit.addEventListener('pointermove',mv);hit.addEventListener('pointerleave',lv);
}
/* grouped column chart with optional whiskers */
function colChart(host,o){
  const W=host.clientWidth||640,H=o.height||(W<520?220:260),m={l:58,r:10,t:10,b:30},iw=W-m.l-m.r,ih=H-m.t-m.b,N=o.labels.length,K=o.series.length;
  let mx=0;o.series.forEach(s=>s.vals.forEach((v,i)=>{mx=Math.max(mx,v||0,s.hi?s.hi[i]||0:0)}));const yt=nice(mx*1.03),Y=v=>m.t+ih-v/yt.max*ih;
  const gw=iw/N,bw=Math.min(40,(gw*.72)/K);let g='';
  for(let v=0;v<=yt.max+1e-9;v+=yt.step)g+=`<line class="gridl" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="axis" x="${m.l-8}" y="${Y(v)+4}" text-anchor="end">${short(v)}</text>`;
  o.labels.forEach((l,i)=>{const cx=m.l+gw*(i+.5);g+=`<text class="axis" x="${cx}" y="${H-m.b+16}" text-anchor="middle">${esc(l)}</text>`;
    o.series.forEach((s,k)=>{const v=s.vals[i];if(v==null)return;const x=cx-(K*bw+(K-1)*2)/2+k*(bw+2);
      g+=`<path ${ANIM?`class="a-grow" style="animation-delay:${i*70}ms"`:''} d="M${x},${Y(0)}V${Y(v)+3}Q${x},${Y(v)} ${x+3},${Y(v)}H${x+bw-3}Q${x+bw},${Y(v)} ${x+bw},${Y(v)+3}V${Y(0)}Z" fill="${s.color}" ${s.opacity?`opacity="${s.opacity}"`:''}/>`;
      if(s.lo&&s.lo[i]!=null){const xm=x+bw/2;g+=`<path d="M${xm},${Y(s.lo[i])}V${Y(s.hi[i])}M${xm-4},${Y(s.lo[i])}H${xm+4}M${xm-4},${Y(s.hi[i])}H${xm+4}" stroke="var(--fg)" stroke-width="1.2" fill="none"/>`}})});
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}">${g}<g id="cols"></g></svg>`;
  const svg=host.firstChild,t=tipEl(host);
  svg.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)*W/r.width;const i=Math.floor((px-m.l)/gw);if(i<0||i>=N){t.hidden=true;return}
    t.innerHTML=`<b>${esc(o.tips?o.tips[i]:o.labels[i])}</b>`+o.series.filter(s=>s.vals[i]!=null).map(s=>`<div class="r"><span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span><b>${n0(s.vals[i])}</b></div>`+(s.lo&&s.lo[i]!=null?`<div class="r" style="color:var(--muted)"><span>&nbsp;&nbsp;80% band</span><span>${n0(s.lo[i])} – ${n0(s.hi[i])}</span></div>`:'')).join('');
    placeTip(host,t,m.l+gw*(i+.5),m.t+ih/3)});svg.addEventListener('pointerleave',()=>t.hidden=true);
}
function hbars(host,rows,o={}){ // rows: {label,v,text,sel,onclick,color,title}
  const mx=Math.max(...rows.map(r=>r.v||0),1e-9);
  host.innerHTML='<div class="bars">'+rows.map((r,i)=>`<div class="brow ${r.sel?'sel':''} ${r.onclick?'click':''}" data-i="${i}" title="${esc(r.title||r.label)}"><div class="lab">${esc(r.label)}</div><div class="track"><div class="fill ${ANIM?'a-barx':''}" style="animation-delay:${i*35}ms;width:${Math.max(.5,(r.v||0)/mx*100)}%;background:${r.color||o.color||'var(--s1)'}"></div></div><div class="val">${esc(r.text??n0(r.v))}</div></div>`).join('')+'</div>';

function table(host,cols,rows,o={}){
  const key=o.key,dir=o.dir||-1;let r=rows.slice();
  if(key){r.sort((a,b)=>{const x=a[key],y=b[key];if(x==null)return 1;if(y==null)return -1;return (typeof x==='string'?x.localeCompare(y):x-y)*dir})}
  host.innerHTML=`<div class="scroll" ${o.maxh?`style="max-height:${o.maxh}px;overflow-y:auto"`:''}><table><thead><tr>${cols.map(c=>`<th class="${c.num?'num':''} ${o.sortable?'sort':''}" data-k="${c.k}" ${o.sortable?'tabindex="0" role="button"':''}>${esc(c.label)}${key===c.k?(dir<0?' ▾':' ▴'):''}</th>`).join('')}</tr></thead><tbody>${r.map((x,i)=>`<tr class="${o.onrow?'click':''} ${o.isSel&&o.isSel(x)?'sel':''}" data-i="${i}">${cols.map(c=>`<td class="${c.num?'num':''}">${c.html?c.html(x):esc(c.fmt?c.fmt(x[c.k],x):x[c.k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(o.sortable)host.querySelectorAll('th.sort').forEach(th=>{const f=()=>{const k=th.dataset.k;const nd=(o.key===k)?-dir:-1;table(host,cols,rows,{...o,key:k,dir:nd});o.onsort&&o.onsort(k,nd)};th.addEventListener('click',f);th.addEventListener('keydown',e=>{if(e.key==='Enter')f()})});
  if(o.onrow)host.querySelectorAll('tbody tr').forEach(tr=>tr.addEventListener('click',()=>o.onrow(r[+tr.dataset.i])));
}
const badge=(t,k='')=>`<span class="badge ${k}">${esc(t)}</span>`;
const seg=(id,opts,val)=>`<div class="seg" id="${id}" role="group">${opts.map(([k,l])=>`<button data-k="${k}" aria-pressed="${k===val}">${esc(l)}</button>`).join('')}</div>`;

function download(name,text,type='text/csv'){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}}
async function copyText(text,btn){try{await navigator.clipboard.writeText(text);flash(btn,'Copied')}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');flash(btn,'Copied')}catch(_){flash(btn,'Copy blocked')}ta.remove()}}
const flash=(b,t)=>{const o=b.textContent;b.textContent=t;setTimeout(()=>b.textContent=o,1200)};
const csv=(rows,cols)=>[cols.join(',')].concat(rows.map(r=>cols.map(c=>{const v=r[c];return v==null?'':/[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v}).join(','))).join('\n');
const evLabel=d=>[d.hol,d.fest,d.dis].filter(Boolean).join('; ');
