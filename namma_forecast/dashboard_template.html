<style>

:root{

  --good:#2d7a46; --warn:#8f5c00; --crit:#b3362f; --good-bg:#e3eedf; --warn-bg:#f5e8c9; --crit-bg:#f4dcd6;
  --hatch:#cdc7de; --shadow:0 6px 18px rgba(40,28,60,.12);

}

  --fg:#ece8f1; --fg2:#c2bccb; --muted:#9189a0; --accent:#a77fd6; --accent-ink:#17111f; --accent-soft:#2a2236;
  --s1:#8f5fc9; --s2:#c97512; --s3:#2a9a6d; --s4:#4682c0; --s5:#c9547f; --s6:#a3961a; --s7:#cf5656; --s8:#3aa0ae;
  --good:#5cbf7c; --warn:#e0a63a; --crit:#ee7a70; --good-bg:#182a1e; --warn-bg:#33280f; --crit-bg:#361b18; --hatch:#3d3946; --shadow:0 6px 18px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{

  --fg:#ece8f1; --fg2:#c2bccb; --muted:#9189a0; --accent:#a77fd6; --accent-ink:#17111f; --accent-soft:#2a2236;
  --s1:#8f5fc9; --s2:#c97512; --s3:#2a9a6d; --s4:#4682c0; --s5:#c9547f; --s6:#a3961a; --s7:#cf5656; --s8:#3aa0ae;

*{box-sizing:border-box}

p{margin:0}
.wrap{max-width:1240px;margin:0 auto}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

.btn:hover{border-color:var(--accent)} .btn:active{transform:scale(.96)} .btn:focus-visible,.tab:focus-visible,select:focus-visible,input:focus-visible,th.sort:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--fg);border-radius:2px;padding:14px 16px 16px;min-width:0;transition:box-shadow .25s,transform .25s,background-color .35s,border-color .35s}
.panel:hover{box-shadow:var(--shadow)}
.panel>h3{margin-bottom:2px}.sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:2px;padding:12px 14px;min-width:0;transition:transform .2s,box-shadow .25s,background-color .35s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi .l{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--font-head);font-size:25px;font-weight:700;font-variant-numeric:lining-nums tabular-nums;line-height:1.2}
.kpi .n{font-size:12px;color:var(--fg2)}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.controls label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%;min-width:0}
.controls select{min-width:0;max-width:100%}
.pagehead>*,.controls>*{min-width:0}
select,input[type=text],input[type=search]{font:inherit;font-size:13px;color:var(--fg);background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:5px 8px;max-width:100%;transition:border-color .15s}
select:hover,input:hover{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:3px;overflow:hidden}
.seg button{font:inherit;font-size:12.5px;background:var(--surface);color:var(--fg2);border:0;padding:5px 12px;cursor:pointer;transition:background-color .2s,color .2s}
.seg button:hover{background:var(--surface2)}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"],.seg button[aria-pressed="true"]:hover{background:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;font-family:var(--font-mono);font-size:10.5px;font-weight:500;border-radius:2px;padding:1px 7px;background:var(--surface2);color:var(--fg2);border:1px solid var(--border);white-space:nowrap}

.scroll{overflow-x:auto;max-width:100%}

th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--border);font-size:12.5px;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td:first-child{white-space:nowrap}td.num{white-space:nowrap}th.sort{cursor:pointer} td.num,th.num{text-align:right} tr.sel td{background:var(--accent-soft)} tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)} tbody tr td{transition:background-color .15s}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg2);margin:2px 0 6px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
.legend i.dash{border-top-style:dashed}.legend i.box{height:9px;width:14px;border:0;border-radius:2px;opacity:.3}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--border);border-radius:3px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);z-index:5;min-width:140px;white-space:nowrap;animation:tipin .14s ease-out}
@keyframes tipin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tip b{font-weight:600}.tip .r{display:flex;justify-content:space-between;gap:14px}.tip .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.axis{fill:var(--muted);font-size:10.5px;font-family:var(--font-mono)}.gridl{stroke:var(--grid)}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 2px 2px 0;font-size:12.5px;color:var(--fg2)}
.note.warn{border-left-color:var(--warn);background:var(--warn-bg)}
.bars{display:grid;gap:5px}
.brow{display:grid;grid-template-columns:minmax(120px,32%) 1fr 70px;gap:8px;align-items:center;font-size:12.5px}
.brow .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .track{height:12px;background:var(--surface2);border-radius:2px;position:relative;overflow:hidden}
.brow .fill{position:absolute;inset:0 auto 0 0;border-radius:0 2px 2px 0;background:var(--s1);transform-origin:left center}
.brow{transition:background-color .15s}.brow.click:hover{background:var(--surface2)}
.brow .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--fg2)}
.brow.sel .lab{font-weight:600}.brow.click{cursor:pointer}
.heat{display:grid;gap:2px;font-size:10.5px}
.heat div{height:20px;border-radius:1px;display:flex;align-items:center;justify-content:center;color:transparent}
.heat div:hover{outline:1px solid var(--fg);transform:scale(1.18);position:relative;z-index:2}
.heat div{transition:transform .12s}
.heat .rl{color:var(--muted);justify-content:flex-start;background:none!important}
.dl{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:12.5px}.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
ul.tight{margin:6px 0 0;padding-left:18px}ul.tight li{margin:2px 0}
.empty{color:var(--muted);padding:20px;text-align:center}
.mono{font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .brand{flex-wrap:wrap;gap:2px 8px}.brand b{font-size:18px;white-space:nowrap}.brand span{flex-basis:100%;font-size:10.5px}
  .kpi .v{font-size:22px}h2{font-size:24px}.panel{padding:12px}
}

.hero{position:relative;overflow:hidden;height:196px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));background:#0e0a24;color:#fff}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:5px;background:linear-gradient(90deg,#6a3a9c 0 34%,#1f8a5b 34% 67%,#d9a31a 67%)}
.scene{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;z-index:2;max-width:1240px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hero .brand{align-items:center}.hero .brand b{font-size:clamp(26px,4.4vw,44px);color:#fff;text-shadow:0 2px 18px rgba(10,6,30,.6);line-height:1.05}

.layer{transform:translateY(calc(var(--sy,0)*.18px))}.layer.near{transform:translateY(calc(var(--sy,0)*.32px))}
.train{transform:translateX(700px)}.train2{transform:translateX(900px)}

/* ---------- 6. data quality & sources */
function pgQuality(){
  const dq=D.dq,tr=D.tracker,lagDays=Math.round((new Date(D.meta.tracker_last)-new Date(D.meta.hourly_last))/864e5);
  const ic=D.meta.rt.imp_counts;

  V().innerHTML=head('Data quality and sources','Where the data come from, what is missing, what was masked or flagged, and how the station data compare with the independent tracker series.',
    `<span class="chip">Pipeline run ${esc(D.meta.generated_at)}</span>`)+`
  <div class="kpis">
    <div class="kpi"><div class="l">Hourly freshness</div><div class="v">${D.meta.rt.stale_hourly_days} d</div><div class="n">hourly data end ${D.meta.rt.stale_hourly_days} days before the first forecast day</div></div>
    <div class="kpi"><div class="l">Days imputed</div><div class="v">${n0(ic.gap+ic.extension+ic.bridge)}</div><div class="n">${ic.gap} inside the data · ${ic.extension} to tracker end · ${ic.bridge} to run date (flagged, never zero)</div></div>
    <div class="kpi"><div class="l">Station-days not open</div><div class="v">${n0(dq.flag_counts.NOT_OPEN/24)}</div><div class="n">masked NOT_OPEN, kept as missing</div></div>
    <div class="kpi"><div class="l">Suspect station-hours</div><div class="v">${n0(dq.flag_counts.SUSPECT_entries+dq.flag_counts.SUSPECT_exits)}</div><div class="n">flagged, never altered</div></div>
    <div class="kpi"><div class="l">Tracker days missing</div><div class="v">${trSpan-tr.dates.length}</div><div class="n">of ${trSpan} calendar days</div></div>
    <div class="kpi"><div class="l">Tracker QR total fixed</div><div class="v">${tr.qr_bad.reduce((a,b)=>a+b,0)}</div><div class="n">days where QR total ≠ sum of apps</div></div>
  </div>
  <div class="grid">
   <section class="panel c12"><h3>Source coverage and provenance</h3><p class="sub">Raw files are never modified; SHA-256 identifies the exact file used.</p><div id="src"></div></section>
   <section class="panel c12"><h3>Station × date coverage</h3><p class="sub">Each row is a station, each column a day. Hover for details.</p><div id="cl"></div><div class="chart" id="cov" style="margin-top:6px"></div></section>
   <section class="panel c7"><h3>Station-data vs tracker reconciliation</h3><p class="sub">${rec.overlap_days} overlapping days. Station entries are about <b>${n0(rec.ratio_median_full_network*100)}%</b> of the tracker total (p10–p90 ${n0(rec.ratio_p10*100)}–${n0(rec.ratio_p90*100)}%) on complete-network days. Definitions differ (boardings by hour vs all ticket modes), so values are compared, not merged.</p><div id="rl"></div><div class="chart" id="rc"></div></section>
   <section class="panel c5"><h3>Data flags</h3><p class="sub">Station-hour values by quality flag (entries + exits counted once per hour)</p><div id="fl"></div><h3 style="margin-top:14px;font-size:13px">Stations with most suspect hours</h3><div id="sus"></div></section>
   <section class="panel c12"><h3>Gap filling (imputation)</h3><p class="sub">${esc(D.meta.rt.reason)}.</p><div class="note" style="margin-bottom:10px"><b>Method.</b> Station-hour value = tracker total for that day × station-derived/tracker ratio × station share × hour-of-day share. The tracker supplies the day's level (actual where published, seasonal fill for ${D.meta.rt.tracker_filled} missing tracker days, forecast after ${fdate(D.meta.rt.tracker_last)}); shares and profiles come from the last 35 observed days by day type (weekday, Saturday, Sunday/holiday). Missing values are never filled with zero, and every filled value carries the IMPUTED flag. Limits: shares and ratios are frozen at ${fdate(D.meta.rt.hourly_last)}; stations opened or re-timed since then are not seen, so station-level imputed values carry extra uncertainty (bands widened ×${D.meta.rt.inflation}).</div><p class="sub">Accuracy check: observed days were hidden, filled with the method and compared with what was observed (WAPE, lower is better).</p><div id="impv"></div></section>
   <section class="panel c12"><h3>Cleaning and validation log</h3><div id="log"></div></section>
   <section class="panel c12"><div class="controls" style="justify-content:space-between"><div><h3>Station mapping</h3><p class="sub">Canonical station dimension; source aliases and codes map to one identifier.</p></div><input type="search" id="mq" placeholder="Search station, code or old name" aria-label="Search mapping"></div><div id="map"></div></section>
  </div>`;
  table($('#impv'),[{k:'scenario',label:'Hidden block'},{k:'method',label:'Method'},{k:'measure',label:'Measure'},{k:'hourly_WAPE',label:'Station-hour WAPE %',num:1,fmt:n1},{k:'daily_WAPE',label:'Station-day WAPE %',num:1,fmt:n1},{k:'network_WAPE',label:'Network-day WAPE %',num:1,fmt:n1},{k:'network_bias_pct',label:'Network bias %',num:1,fmt:sgn}],D.meta.rt.imp_val);
  table($('#src'),[{k:'source_id',label:'Source'},{k:'file',label:'File'},{k:'rows',label:'Rows',num:1,fmt:n0},{k:'date_min',label:'From'},{k:'date_max',label:'To'},{k:'definition',label:'Definition'},{k:'limitations',label:'Known limitations'},{k:'license',label:'Licence'},{k:'sha256',label:'SHA-256',fmt:v=>(v||'').slice(0,10)+'…'}],dq.prov);
  // coverage canvas
  $('#cl').innerHTML=legend([{name:'Observed',color:'var(--s1)',box:1},{name:'Station not yet open',color:'var(--s4)',box:1},{name:'Imputed (model-filled)',color:'var(--s2)',box:1},{name:'No hourly data for that date',color:'var(--hatch)',box:1}]).replace(/opacity:.3/g,'');
  reg(()=>{const host=$('#cov'),W=host.clientWidth||700,cw=Math.max(4,Math.floor((W-150)/ND)),ch=Math.max(3,Math.min(7,Math.floor(560/S))),H=S*ch+22;host.innerHTML=`<canvas width="${W*2}" height="${H*2}" style="width:${W}px;height:${H}px"></canvas>`;const c=host.firstChild,x=c.getContext('2d');x.scale(2,2);const cs=getComputedStyle(document.documentElement),col={1:cs.getPropertyValue('--s1').trim(),2:cs.getPropertyValue('--s4').trim(),3:cs.getPropertyValue('--s2').trim(),0:cs.getPropertyValue('--hatch').trim()};
    const fg=cs.getPropertyValue('--muted').trim();x.font='10px Inter, sans-serif';x.fillStyle=fg;
    for(let s=0;s<S;s++){for(let d=0;d<ND;d++){x.fillStyle=col[stat(s,d)];x.globalAlpha=stat(s,d)===1?.9:stat(s,d)===3?.45:.8;x.fillRect(140+d*cw,s*ch,cw-1,ch-(ch>4?1:0))}x.globalAlpha=1;if(s%6===0||s===S-1){x.fillStyle=fg;x.fillText(ST[s].name.slice(0,22),2,s*ch+Math.min(ch,8))}}
    x.fillStyle=fg;for(let d=0;d<ND;d+=7)x.fillText(fdate(D.dates[d].d),140+d*cw,H-6);
    const t=tipEl(host);c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,d=Math.floor((px-140)/cw),s=Math.floor(py/ch);if(d<0||d>=ND||s<0||s>=S){t.hidden=true;return}const k=stat(s,d);t.innerHTML=`<b>${esc(ST[s].name)}</b><div>${fdowdate(D.dates[d].d)}</div><div style="color:var(--muted)">${k===1?'observed':k===2?'not yet open (masked)':k===3?'imputed (model-filled)':'no data for this date'}</div>`;placeTip(host,t,px,py)});c.addEventListener('pointerleave',()=>t.hidden=true)});
  // reconciliation
  const R=rec.table,Lr=R.map(r=>r.date);$('#rl').innerHTML=legend([{name:'Station entries (sum of stations)',color:'var(--s1)'},{name:'Tracker total (all ticket modes)',color:'var(--s3)'}]);
  reg(()=>lineChart($('#rc'),{labels:Lr,series:[{name:'Tracker total',color:'var(--s3)',vals:R.map(r=>r.tracker_total),dots:1},{name:'Station entries',color:'var(--s1)',vals:R.map(r=>r.station_entries),dots:1}],xFmt:fdate,tipTitle:i=>fdowdate(Lr[i]),tipExtra:i=>`<div style="color:var(--muted)">ratio ${n1(R[i].ratio*100)}% · ${R[i].n_stations} stations</div>`}));
  const fcnt=dq.flag_counts;hbars($('#fl'),[{label:'Observed station-hours',v:fcnt.OBSERVED,color:'var(--s1)'},{label:'Not open (masked)',v:fcnt.NOT_OPEN,color:'var(--s4)'},{label:'Suspect entries',v:fcnt.SUSPECT_entries,color:'var(--s8)'},{label:'Suspect exits',v:fcnt.SUSPECT_exits,color:'var(--s8)'}].map(r=>({...r,text:n0(r.v)})));
  hbars($('#sus'),Object.entries(dq.suspect_by_station).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>({label:k,v,color:'var(--s8)'})));
  table($('#log'),[{k:'severity',label:'Level',html:r=>badge(r.severity,r.severity==='WARN'?'warn':r.severity==='ERROR'?'crit':'')},{k:'step',label:'Step'},{k:'scope',label:'Scope'},{k:'detail',label:'Finding'},{k:'n_records',label:'Records',num:1,fmt:n0},{k:'action',label:'Action taken'}],dq.log);
  const mapRows=()=>ST.filter(s=>!$('#mq').value||(s.name+' '+s.code+' '+s.alias).toLowerCase().includes($('#mq').value.toLowerCase())).map(s=>({id:s.id,name:s.name,code:s.code,alias:s.alias,line:s.line,ich:s.ich?'Yes':'',open:s.open||('on/before '+D.meta.hourly_first),days:s.days,match:s.match}));
  const dm=()=>table($('#map'),[{k:'id',label:'ID'},{k:'name',label:'Canonical name'},{k:'code',label:'Code'},{k:'alias',label:'Source alias (old name)'},{k:'line',label:'Line'},{k:'ich',label:'Interchange'},{k:'open',label:'Opening'},{k:'days',label:'Obs. days',num:1},{k:'match',label:'Reference match'}],mapRows(),{maxh:380});dm();$('#mq').oninput=dm;
}
/* ---------- 7. report & export */
function pgReport(){
  const ac=D.acceptance,E=D.meta.evaluation,sel=D.meta.sel;
  const hourlyCsv=()=>{const out=['station_id,station,target_datetime,measure,predicted,lower_80,upper_80,horizon_step,is_operating_hour,model'];for(const m of ['entries','exits'])for(let i=0;i<S;i++)for(let j=0;j<168;j++){const k=Math.floor(j/24),h=j%24;out.push([ST[i].id,'"'+ST[i].name+'"',D.fdates[k].d+' '+hh(h),m,D.fc[m].pred[i][j],D.fc[m].lo[i][j],D.fc[m].hi[i][j],j+1,[1,2,3].includes(h)?0:1,sel.hourly].join(','))}return out.join('\n')};
  const dailyCsv=()=>{const r=[];for(const m of ['entries','exits'])for(let i=0;i<S;i++){const d=fcDaily(m,i),q=D.fc[m].dq;d.forEach((v,k)=>r.push({station_id:ST[i].id,station:ST[i].name,measure:m,date:D.fdates[k].d,forecast:Math.round(v),lower_80:Math.round(v*q[0]),upper_80:Math.round(v*q[1])}))}return csv(r,['station_id','station','measure','date','forecast','lower_80','upper_80'])};
  const netCsv=()=>{const r=[];for(const m of ['entries','exits']){const d=fcNet(m),q=D.fc[m].nqd;d.forEach((v,k)=>r.push({scope:'station_derived',measure:m,date:D.fdates[k].d,forecast:Math.round(v),lower_80:Math.round(v*q[k][0]),upper_80:Math.round(v*q[k][1])}))}const T=D.tracker.fc;T.dates.forEach((d,k)=>k<T.t0?0:r.push({scope:'tracker_all_ticket_modes',measure:'total',date:d,forecast:T.pred[k],lower_80:T.lo[k],upper_80:T.hi[k]}));return csv(r,['scope','measure','date','forecast','lower_80','upper_80'])};
  const metCsv=()=>{const cols=['level','model','measure','MAE','RMSE','MAPE','WAPE','sMAPE','n','n_mape_excluded','wape_fold_mean','runtime_s'];const r=[];for(const l of ['hourly','daily','network'])D.metrics[l].forEach(x=>r.push({...x,level:l}));D.tracker_metrics.forEach(x=>r.push({...x,level:'tracker',measure:'total'}));return csv(r,cols)};
  const dqCsv=()=>csv(D.dq.log,['severity','step','scope','detail','n_records','action']);
  const srcCsv=()=>csv(D.dq.prov,['source_id','file','format','sha256','rows','date_min','date_max','dates','stations','url','downloaded','license','origin','definition','limitations']);
  const limits=['Only '+nOpen().filter(v=>v>0).length+' days of station-hour history are observed (two blocks). Everything after '+D.meta.hourly_last+' is imputed from the tracker, so station shares, hour profiles and the station-derived/tracker ratio are '+D.meta.rt.stale_hourly_days+' days old. New stations, line changes and demand shifts since then are invisible at station level.','The Yellow Line opening on 11 Aug 2025 is a structural break; its 15 stations have under 8 weeks of history and are flagged.','The tracker ends on '+D.meta.rt.tracker_last+' ('+D.meta.rt.stale_tracker_days+' days before the first forecast day); the days in between are model estimates. The forecast window is always the 7 days after the run date ('+D.meta.rt.run_date+').','Holiday and event flags are keyword-classified from the supplied date list and need checking against the official Karnataka holiday list.','No weather data is available: weather columns are NULL and every model runs without them.','Station entries are about '+n0(D.recon_ratio*100)+'% of the tracker total; the series are never merged.',D.meta.rt.tracker_filled+' tracker days are missing and are filled seasonally inside the model fit only; they are never scored. QR totals are recomputed from the app columns.','Festivals, strikes, matches and disruptions are poorly predicted by lag-based models; prediction intervals are empirical and based on '+E.n_folds+' test weeks.','Forecasts support planning and trigger no operational action. Hourly data licence: ODbL / CC BY-NC-SA 4.0; check before non-academic use.'];
  const assume=['Historical weekday and hour patterns carry information about the next 7 days.','Hour h means [h:00, h+1:00) local Bengaluru time; hour 23 runs to the last train.','Hours 01–03 are non-operating (over 99.9% zeros) and are forecast as 0.','A station is open from the first day with at least 10% of its median daily traffic; earlier values are trial runs and are masked.','Entries and exits are separate targets; daily = sum of hours; network = sum of stations.','Missing station-hours are never filled with zero; model-filled values are flagged IMPUTED and validated on hidden observed days.'];
  const md=`# Assumptions and limitations\n\n## Assumptions\n${assume.map(x=>'- '+x).join('\n')}\n\n## Limitations\n${limits.map(x=>'- '+x).join('\n')}\n`;
  const ex=[['forecast_station_hourly_7day.csv','Hourly station forecasts, entries and exits (168 steps × '+S+' stations)',hourlyCsv],['forecast_station_daily_7day.csv','Station-wise daily forecasts',dailyCsv],['forecast_network_daily_7day.csv','Network-wide daily forecasts: station-derived and tracker',netCsv],['model_metrics.csv','Hourly, daily, network-day and tracker metrics',metCsv],['data_quality_log.csv','Cleaning and validation log',dqCsv],['source_provenance.csv','Sources, coverage, licences, checksums',srcCsv],['assumptions_limitations.md','Assumptions and limitations',()=>md]];
  V().innerHTML=head('Report and export','Everything needed to review or reuse the results: assumptions, limitations, acceptance status, runtimes and exportable tables.')+`
  <div class="grid">
   <section class="panel c7"><h3>Exports</h3><p class="sub">Download works in the standalone file. If a download is blocked in your viewer, use Copy. The full set (including the SQLite database and the Markdown project report) is in the <code>outputs/</code> folder produced by the pipeline.</p><div id="ex"></div></section>
   <section class="panel c5"><h3>This run</h3><dl class="kv"><dt>Generated</dt><dd>${esc(D.meta.generated_at)}</dd><dt>Version</dt><dd>${esc(D.meta.version)}</dd><dt>Hourly forecast model</dt><dd>${esc(sel.labels[sel.hourly])}</dd><dt>Daily model</dt><dd>${esc(sel.labels[sel.daily])}</dd><dt>Tracker model</dt><dd>${esc(sel.tracker_label)}</dd><dt>Folds</dt><dd>${E.n_folds} × 7 days (hourly), ${E.tracker_folds} weekly (tracker)</dd><dt>Environment</dt><dd>Python ${esc(D.meta.env.python)}, pandas ${esc(D.meta.env.pandas)}, numpy ${esc(D.meta.env.numpy)}</dd><dt>Runtime (NFR-01)</dt><dd>${n1(sum(Object.values(D.meta.timer)))} s total</dd></dl><div id="rt" style="margin-top:8px"></div></section>
   <section class="panel c6"><h3>Assumptions</h3><ul class="tight">${assume.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>
   <section class="panel c6"><h3>Limitations and caveats</h3><ul class="tight">${limits.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>
   <section class="panel c12"><h3>Acceptance criteria</h3><p class="sub">Evaluated by the pipeline on this run. Performance note: ${esc(ac.performance.note)}.</p><div id="ac"></div></section>
   <section class="panel c12"><h3>Requirement traceability</h3><p class="sub">Stakeholder, functional and non-functional requirements of the SRS and where each is met.</p><div id="tr"></div></section>
   <section class="panel c12"><div class="note warn"><b>Academic prototype.</b> This system is not an official BMRCL product and carries no BMRCL approval. Forecasts are estimates for planning discussion and do not control schedules, staffing or services.</div></section>
  </div>`;
  $('#ex').innerHTML=ex.map((e,i)=>`<div style="display:flex;gap:10px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding:7px 0;flex-wrap:wrap"><div style="min-width:0"><b style="font-size:13px">${e[0]}</b><div style="color:var(--muted);font-size:12px">${esc(e[1])}</div></div><div class="dl"><button class="btn primary" data-dl="${i}">Download</button><button class="btn" data-cp="${i}">Copy</button></div></div>`).join('');
  document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{const e=ex[+b.dataset.dl];download(e[0],e[2](),e[0].endsWith('.md')?'text/markdown':'text/csv')});
  document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>copyText(ex[+b.dataset.cp][2](),b));
  table($('#rt'),[{k:'k',label:'Stage'},{k:'v',label:'Seconds',num:1,fmt:n1}],Object.entries(D.meta.timer).map(([k,v])=>({k,v})));
  table($('#ac'),[{k:'id',label:'ID'},{k:'condition',label:'Condition'},{k:'status',label:'Status',html:r=>badge(r.status,r.status==='PASS'?'good':'warn')},{k:'evidence',label:'Evidence'}],ac.ac);
  table($('#tr'),[{k:'id',label:'ID'},{k:'name',label:'Requirement'},{k:'where',label:'Where it is met'}],ac.trace,{maxh:420});
}
/* ------------------------------------------------------------ router */
const PAGES=[['overview','Network overview','8.1',pgOverview],['stations','Station analysis','8.2',pgStations],['hourly','Hourly profile','8.3',pgHourly],['forecast','7-day forecast','8.4',pgForecast],['models','Model performance','8.5',pgModels],['quality','Data quality','8.6',pgQuality],['report','Report & export','8.7',pgReport]];
function placeInk(){const t=document.querySelector('.tab[aria-selected="true"]'),k=$('#ink');if(!t||!k)return;k.style.left=t.offsetLeft+'px';k.style.width=t.offsetWidth+'px';window._ink={l:t.offsetLeft,w:t.offsetWidth}}
function countUp(root){if(!motionOK())return;root.querySelectorAll('.kpi .v').forEach(el=>{const txt=el.textContent.trim(),m=txt.match(/^(\d[\d,]*\.?\d*)(\s?(?:k|M|%|d)?)$/);if(!m)return;const target=parseFloat(m[1].replace(/,/g,'')),dec=(m[1].split('.')[1]||'').length,comma=m[1].includes(',');if(!(target>0))return;const t0=performance.now(),D=900;
    const f=now=>{const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,3),v=target*e;el.textContent=p>=1?txt:(comma?Math.round(v).toLocaleString('en-IN'):v.toFixed(dec))+m[2];if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function render(){
  ANIM=true;redraw.length=0;const p=PAGES.find(x=>x[0]===st.page)||PAGES[0];
  $('#tabs').innerHTML=PAGES.map(x=>`<button class="tab" role="tab" id="t-${x[0]}" aria-selected="${x[0]===p[0]}" data-p="${x[0]}"><small>${x[2]}</small>${x[1]}</button>`).join('');
  $('#tabs').insertAdjacentHTML('beforeend','<span class="ink" id="ink"></span>');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.p});
  const ink=$('#ink');if(window._ink){ink.style.transition='none';ink.style.left=_ink.l+'px';ink.style.width=_ink.w+'px';ink.getBoundingClientRect();ink.style.transition=''}placeInk();
  try{p[3]();countUp($('#view'))}finally{ANIM=false}
  const t=$('#t-'+p[0]);t&&t.scrollIntoView({inline:'center',block:'nearest'});
}
function route(){const h=location.hash.slice(1);st.page=PAGES.some(x=>x[0]===h)?h:'overview';const v=$('#view');v.classList.remove('enter');void v.offsetWidth;v.classList.add('enter');render();window.scrollTo(0,0)}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>redraw.forEach(f=>f()),120)});
function themeBtn(){const b=document.createElement('button');b.className='btn';b.id='theme';b.setAttribute('aria-label','Toggle colour theme');const upd=()=>b.textContent=isDark()?'Light mode':'Dark mode';upd();
  b.onclick=()=>{document.documentElement.dataset.theme=isDark()?'light':'dark';upd();redraw.length=0;render()};return b}
async function boot(){
  try{const txt=$('#data').textContent.trim();D=txt?JSON.parse(txt):await (await fetch('dashboard_data.json')).json()}
  catch(e){$('#view').innerHTML='<div class="empty">Could not load the dashboard data. Run the pipeline to generate dashboard_data.json next to this page.</div>';return}
  prep();
  $('#sub').textContent=`run ${fdate(D.meta.rt.run_date,{day:'2-digit',month:'short',year:'numeric'})} · forecast ${fdate(D.meta.rt.fc_start,{day:'2-digit',month:'short'})} – ${fdate(D.meta.rt.fc_end,{day:'2-digit',month:'short',year:'numeric'})} · ${S} stations · station-hour data ${fdate(D.meta.hourly_first,{day:'2-digit',month:'short',year:'numeric'})} – ${fdate(D.meta.hourly_last,{day:'2-digit',month:'short',year:'numeric'})}`;
  const c=$('#chips');c.appendChild(themeBtn());
  matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme)render()});
  {let css='';for(let k=2;k<=25;k++)css+=`.heat.pop>div:nth-child(25n+${k%25||25}){animation-delay:${(k-2)*16}ms}`;const el=document.createElement('style');el.textContent=css;document.head.appendChild(el)}
  window.addEventListener('scroll',()=>{$('header.top').classList.toggle('scrolled',window.scrollY>4);if(window.scrollY<400)$('.hero').style.setProperty('--sy',window.scrollY)},{passive:true});
  window.addEventListener('resize',placeInk);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeInk);
  window.addEventListener('hashchange',route);route();
}
boot();
</script>
